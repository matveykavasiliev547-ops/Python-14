version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: postgres_jokes
    restart: always
    environment:
      POSTGRES_USER: postgres_user
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: jokes_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build: .
    command: uvicorn GJ_API_SERVER:app --host 0.0.0.0 --port 8000 --reload
    container_name: fastapi_jokes
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres_user:postgres_password@db:5432/jokes_db
    depends_on:
      - db

volumes:
  pgdata: